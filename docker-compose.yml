# Base definition of the whole chain. It deliberately publishes NO ports:
# ports are added by docker-compose.override.yml for local development (picked
# up automatically) and by docker-compose.prod.yml for a server.
#
# Compose *appends* port lists when files are merged, so a port declared here
# could not be taken back in an override — which is why it must stay out.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mes}
      POSTGRES_DB: mes
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DATABASE_URL: postgresql+psycopg2://mes:${POSTGRES_PASSWORD:-mes}@db:5432/mes
      MACHINE_ID: line1
    depends_on:
      mosquitto:
        condition: service_started
      db:
        condition: service_healthy

  emulator:
    build: ./emulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MACHINE_ID: line1
      TICK_S: 1.0
    depends_on:
      mosquitto:
        condition: service_started

  frontend:
    build: ./frontend
    depends_on:
      - backend
