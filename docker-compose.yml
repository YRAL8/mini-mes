services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
      POSTGRES_DB: mes
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DATABASE_URL: postgresql+psycopg2://mes:mes@db:5432/mes
      MACHINE_ID: line1
    depends_on:
      mosquitto:
        condition: service_started
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  emulator:
    build: ./emulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MACHINE_ID: line1
      TICK_S: 1.0
    depends_on:
      mosquitto:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
