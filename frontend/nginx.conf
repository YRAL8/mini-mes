server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The backend is reached only through this proxy, over the internal Docker
    # network. In production its own port is not published at all, so the API
    # and the WebSocket share this single public port with the dashboard.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The dashboard stream is long-lived; do not cut it at the default 60 s.
        proxy_read_timeout 3600s;
    }

    # Interactive API documentation (read-only endpoints).
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
